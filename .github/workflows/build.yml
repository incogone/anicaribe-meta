name: Build metadata

on:
  schedule:
    - cron: "23 4 * * *"  # every day at 04:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-metadata
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the index from AniList and MangaDex
        run: python scripts/build.py --out out --previous latest.json

      - name: Publish the data as its own commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stamp=$(date -u +%Y%m%d-%H%M)
          remote="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          cd out
          git init -q -b data
          git add -A
          git commit -q -m "Data $stamp"
          # The data branch always holds exactly one commit, so the repository does not grow every day.
          # A dated tag keeps each published commit reachable while apps may still be reading it.
          git tag "data-$stamp"
          git push -q --force "$remote" data "data-$stamp"
          echo "DATA_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "STAMP=$stamp" >> "$GITHUB_ENV"

      - name: Point latest.json at the new data
        run: |
          python - <<'EOF'
          import json, os
          manifest = json.load(open("out/manifest.json", encoding="utf-8"))
          sha, repo = os.environ["DATA_SHA"], os.environ["GITHUB_REPOSITORY"]
          latest = {
              "schema": manifest["schema"],
              "built": manifest["built"],
              "commit": sha,
              "base": f"https://cdn.jsdelivr.net/gh/{repo}@{sha}/",
              "fallback": f"https://raw.githubusercontent.com/{repo}/{sha}/",
              "counts": manifest["counts"],
              "bytes": manifest.get("bytes"),
          }
          with open("latest.json", "w", encoding="utf-8") as handle:
              json.dump(latest, handle, indent=2)
              handle.write("\n")
          EOF
          git add latest.json
          git commit -q -m "Point at data ${STAMP}"
          git push -q origin HEAD:main

      - name: Keep only the last 14 data tags
        run: |
          git fetch -q --tags origin
          old=$(git tag -l 'data-*' | sort | head -n -14)
          if [ -n "$old" ]; then git push -q origin --delete $old; fi

      - name: Refresh jsDelivr
        continue-on-error: true
        run: |
          repo="${{ github.repository }}"
          curl -fsS "https://purge.jsdelivr.net/gh/${repo}@main/latest.json" || true
          echo
          for file in manifest.json search/anime.json.gz search/manga.json.gz; do
            curl -fsS -o /dev/null -w "%{http_code} %{size_download} $file\n" "https://cdn.jsdelivr.net/gh/${repo}@${DATA_SHA}/$file" || true
          done
